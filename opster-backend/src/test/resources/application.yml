spring:
  datasource:
    driver-class-name: org.sqlite.JDBC
    url: jdbc:sqlite::memory:
    username: 
    password: 
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: auto
