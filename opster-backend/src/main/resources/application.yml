server:
  port: 8080
  tomcat:
    connection-timeout: -1
    keep-alive-timeout: -1

spring:
  application:
    name: opster-backend
  datasource:
    driver-class-name: org.sqlite.JDBC
    url: jdbc:sqlite:opster.db
    username: 
    password: 

  jpa:
    database-platform: org.hibernate.community.dialect.SQLiteDialect
    hibernate:
      ddl-auto: update
    show-sql: true
  
  # Spring AI Alibaba Configuration
  ai:
    dashscope:
      api-key: 12312
#      base-url: https://dashscope.aliyuncs.com/compatible-mode/v1
      chat:
        options:
          model: qwen-plus
        enabled: true
      embedding:
        options:
          model: text-embedding-v1
        enabled: false

opster:
  deploy-path: /Users/deffrey/D1_JEFFREY/aiworkspace/deploy
  maven-home: /Users/deffrey/D1_JEFFREY/soft/apache-maven-3.8.6
  java-home: /Library/Java/JavaVirtualMachines/jdk-17.jdk/Contents/Home
  encrypt-key: "opster-secret-key"
  # JDK 多版本配置
  jdk:
    jdk8: /Library/Java/JavaVirtualMachines/jdk1.8.0_421.jdk/Contents/Home
    jdk17: /Library/Java/JavaVirtualMachines/jdk-17.jdk/Contents/Home
  # Node.js 版本管理配置
  nodejs:
    enabled: true
    nvm-path: ~/.nvm
    auto-install: true
    install-timeout: 3000
